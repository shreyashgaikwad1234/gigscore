# Render's free plan stops the API after 15 minutes without traffic, and the next visitor waits about a minute.
# This pings /health every 10 minutes so the demonstration stays responsive. GitHub may delay scheduled runs at busy
# times, and pauses schedules after 60 days without repository activity; the website still shows its static
# copies while the API wakes. One always-on free service uses about 744 of Render's 750 free hours a month.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health
        run: curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 https://gigscore-api.onrender.com/health
